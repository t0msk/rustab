# Flatpak manifest for Rustab.
app-id: dev.tomsk.Rustab
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: rustab

finish-args:
  # WebKitGTK rendering (the frontend is Yew, rendered via WebKitGTK, same
  # as every other Tauri 2 Linux app):
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # Deliberately NOT included: --share=network. Rustab has no runtime
  # network functionality (lsblk/blkid/findmnt are local processes) - see
  # docs/SPEC.md §8. Add it back only if that ever changes.
  #
  # ---------------------------------------------------------------------
  # The one permission Rustab's real-target paths need (T40). CONFIRMED.
  # ---------------------------------------------------------------------
  #
  # It lets this app call the org.freedesktop.Flatpak session-bus service,
  # i.e. use `flatpak-spawn --host` (part of every org.gnome.Platform /
  # org.freedesktop.Platform runtime, so no extra dependency). Rustab uses
  # it for exactly two things, both in src-tauri/src/host.rs:
  #
  #   1. reading the real host /etc/fstab, unprivileged:
  #        flatpak-spawn --host sh -c 'if [ -e "$1" ] ... cat ...' sh /etc/fstab
  #   2. starting its elevated helper as a real host root process:
  #        flatpak-spawn --host pkexec <host path of /app/bin/rustab> \
  #            --internal-privileged-write
  #
  # Confirmed working end-to-end from inside a sandbox granted ONLY this
  # permission (two throwaway diagnostic Flatpak apps, then Rustab itself):
  # `flatpak-spawn --host cat /etc/fstab` printed the real host file;
  # `flatpak-spawn --host id` returned the real host user (proving the
  # spawned process is outside the sandbox's mount namespace, not merely
  # outside its cgroup); `flatpak-spawn --host sh -c 'touch /etc/.test'`
  # failed with EACCES as an unprivileged host process should; and
  # `flatpak-spawn --host pkexec sh -c 'touch /etc/.test && rm /etc/.test'`
  # succeeded.
  - --talk-name=org.freedesktop.Flatpak
  #
  # WHAT WAS TRIED AND DOES NOT WORK - do not re-add either of these:
  #
  # * `--filesystem=/etc:rw` - rejected by flatpak-builder-lint, so it can
  #   never pass Flathub review (this is what T39 was a reaction to).
  # * `--filesystem=/etc/fstab:rw` - a single-file grant, which looks like
  #   the narrow, reviewable compromise and is in fact completely
  #   non-functional: Flatpak reserves the whole /etc path space and
  #   refuses the grant outright, printing
  #     F: Not sharing "/etc/fstab" with sandbox: Path "/etc" is reserved
  #        by Flatpak
  #   and leaving the sandbox with the runtime's own synthetic /etc. Nothing
  #   reaches the real file through it - not a read, not a write, and not a
  #   write by a `pkexec` child either, because pkexec changes a process's
  #   UID, not its mount namespace: a pkexec child of a sandboxed process is
  #   root *inside the same sandbox*. That is the misconception T40 found and
  #   fixed; the mechanism above is the real answer.
  # * `--system-talk-name=org.freedesktop.PolicyKit1` (which the pushed
  #   Flathub manifest still carries, and which this file previously had as
  #   the misspelled `--system-bus-talk=...` - not a real flatpak option at
  #   all) - no longer needed, and deliberately absent. It would let code
  #   *inside* the sandbox talk to polkit through the sandbox's system-bus
  #   proxy. Nothing inside the sandbox does: Rustab's only polkit user is
  #   `pkexec`, and since T40 `pkexec` is invoked by a process that
  #   `flatpak-spawn --host` has already placed on the host, where it uses
  #   the host's own D-Bus connection and never the proxy. Verified by
  #   building and installing this app with the permission removed: the
  #   host-side pkexec chain is unaffected.
  #
  # Nothing else is needed for the backups surface either: a sandboxed
  # session keeps its *manual* backups of /etc/fstab under its own
  # XDG_DATA_HOME (~/.var/app/dev.tomsk.Rustab/data/rustab/), which needs no
  # grant, because /etc cannot be *enumerated* from a sandbox even with
  # host-spawn available - see src-tauri/src/backup_location.rs for that
  # decision and docs/API_CONTRACT.md §3.6 for what the user is told.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  env:
    CARGO_HOME: /run/build/rustab/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: rustab
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline fetch --manifest-path frontend/Cargo.toml
      - >-
        cd frontend &&
        npm ci --offline --cache ../flatpak-node/npm-cache &&
        npx @tailwindcss/cli -i styles/input.css -o styles/tailwind.css &&
        cd ..
      - mkdir -p wasm-bindgen-cli
      - tar xzf wasm-bindgen-cli-bin/wasm-bindgen.tar.gz -C wasm-bindgen-cli --strip-components=1
      - mkdir -p rust-std-wasm32-extracted
      - tar xzf rust-std-wasm32/rust-std-1.98.0-wasm32-unknown-unknown.tar.gz -C rust-std-wasm32-extracted --strip-components=1
      - mkdir -p custom-sysroot
      - cp -rs /usr/lib/sdk/rust-stable/. custom-sysroot/
      - rm -rf custom-sysroot/lib/rustlib/wasm32-unknown-unknown
      - cp -r rust-std-wasm32-extracted/rust-std-wasm32-unknown-unknown/lib/rustlib/wasm32-unknown-unknown custom-sysroot/lib/rustlib/
      - >-
        RUSTFLAGS="--sysroot=$PWD/custom-sysroot"
        cargo --offline build --release --target wasm32-unknown-unknown --manifest-path frontend/Cargo.toml
      - mkdir -p frontend/dist
      - >-
        wasm-bindgen-cli/wasm-bindgen --target web --no-typescript
        --out-dir frontend/dist --out-name rustab
        frontend/target/wasm32-unknown-unknown/release/rustab-frontend.wasm
      - cp frontend/styles/tailwind.css frontend/dist/tailwind.css
      - >-
        sed
        -e 's#<link data-trunk rel="css" href="styles/tailwind.css" />#<link rel="stylesheet" href="tailwind.css" />#'
        -e '/data-trunk rel="copy-file"/d'
        -e 's#</body>#<script type="module">import init from "./rustab.js"; init();</script></body>#'
        frontend/index.html > frontend/dist/index.html
      - cargo --offline build --release -p rustab --features tauri/custom-protocol
      - install -Dm755 target/release/rustab /app/bin/rustab
      - install -Dm644 flatpak/dev.tomsk.Rustab.desktop /app/share/applications/dev.tomsk.Rustab.desktop
      - install -Dm644 flatpak/dev.tomsk.Rustab.metainfo.xml /app/share/metainfo/dev.tomsk.Rustab.metainfo.xml
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/dev.tomsk.Rustab.png
      - install -Dm644 LICENSE-MIT /app/share/licenses/dev.tomsk.Rustab/LICENSE-MIT
      - install -Dm644 LICENSE-APACHE /app/share/licenses/dev.tomsk.Rustab/LICENSE-APACHE
    sources:
      - type: git
        url: https://github.com/t0msk/rustab.git
        tag: v0.1.2
        commit: 78fb6d049cd8a0ebd8456f4be9474f73edc389ae

      - cargo-sources.json

      - frontend-cargo-sources.json

      - node-sources.json

      - type: file
        only-arches: [x86_64]
        url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
        sha256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
        dest: wasm-bindgen-cli-bin
        dest-filename: wasm-bindgen.tar.gz

      - type: file
        only-arches: [aarch64]
        url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-aarch64-unknown-linux-musl.tar.gz
        sha256: 2ed4351c35dd9440308bbb02767d47ea278efe851a52465300f3c94f5b6c2a87
        dest: wasm-bindgen-cli-bin
        dest-filename: wasm-bindgen.tar.gz

      - type: file
        url: https://static.rust-lang.org/dist/rust-std-1.98.0-wasm32-unknown-unknown.tar.gz
        sha256: d2443b4da8d168f152875416ab204fea42f2ed7d9dcce92725d579722e0bdaa5
        dest: rust-std-wasm32
