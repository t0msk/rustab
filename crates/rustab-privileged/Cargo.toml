[package]
name = "rustab-privileged"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "GUI-free half of Rustab: the Tauri-boundary DTOs and the elevated stdin/stdout protocol, shared by the GUI and the rustab-helper binary."
publish = false

# Deliberately tiny, and deliberately free of `tauri`, `log` and any GUI
# dependency: this crate has to link into `rustab-helper`, which is built as
# a fully static musl binary (see `crates/rustab-helper`).
[dependencies]
fstab-core = { path = "../fstab-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "rustab_privileged"
