[package]
name = "rustab-helper"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "GUI-free elevated helper for Rustab: reads one JSON request on stdin, performs it on /etc/fstab, prints one JSON response."
publish = false

# One dependency, and nothing else - not even a logger. Everything this
# binary does lives in `rustab-privileged::protocol`, and the short
# dependency list is what lets it link statically against musl.
[dependencies]
rustab-privileged = { path = "../rustab-privileged" }

[[bin]]
name = "rustab-helper"
path = "src/main.rs"
