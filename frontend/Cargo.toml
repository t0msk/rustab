[package]
name = "rustab-frontend"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Yew + Trunk + Tailwind frontend for Rustab."
publish = false

# This crate is intentionally its own workspace root (empty [workspace] table
# below) rather than a member of the repo's root Cargo workspace. It targets
# wasm32-unknown-unknown and is built independently via `trunk`, which keeps
# its dependency/feature resolution isolated from the native workspace
# members (`crates/fstab-core`, `src-tauri`).
[workspace]

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "Window",
  "Navigator",
  "Clipboard",
  # The entries table's drag-to-reorder gesture (T48): one
  # `getBoundingClientRect` sweep over the rows at `pointerdown`, pointer
  # capture on the handle, and the document-level grabbing cursor.
  "Document",
  "Element",
  "DomRect",
  "Node",
  "NodeList",
  "HtmlElement",
  "CssStyleDeclaration",
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.4", features = ["futures"] }
# Raw unified-diff rendering for `DiffView`'s "Raw diff" tab (T12,
# `docs/UI_DESIGN.md` §6) - a frontend-only, non-safety-critical dependency;
# the actual write path never touches this crate.
similar = "3"
