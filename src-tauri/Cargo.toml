[package]
name = "rustab"
version = "0.1.0"
description = "Tauri 2 application shell for Rustab, a GUI editor for /etc/fstab."
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rustab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.4" }

[dependencies]
fstab-core = { path = "../crates/fstab-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.2.4" }
tauri-plugin-log = "2.0.0-rc"
