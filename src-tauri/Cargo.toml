[package]
name = "rustab"
version = "0.2.0"
description = "Tauri 2 application shell for Rustab, a GUI editor for /etc/fstab."
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rustab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.4", features = [] }

[dependencies]
fstab-core = { path = "../crates/fstab-core" }
rustab-privileged = { path = "../crates/rustab-privileged" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.2.4", features = [] }
tauri-plugin-log = "2.0.0-rc"
# Directory picker for the Mount point field's "Browse..." button - talks
# to the FileChooser portal directly (see pick_directory in commands.rs).
ashpd = { version = "0.13.13", features = ["file_chooser", "documents"] }
url = "2.5"
