name: Release build

# Continuous packaging build for the `release` branch (docs/SPEC.md §13
# point 1). Deliberately kept separate from `ci.yml`, which gates every
# push/PR to `master` with fmt/clippy/test/build: this workflow's only job
# is to turn whatever is currently on `release` into installable packages
# (.deb / .rpm / .AppImage, each natively for both x86_64 and aarch64 -
# see the build matrix below - plus an AppImage.zsync delta file per
# architecture for AppImageUpdate-style self-updating) and upload them as
# run artifacts, so there is always a downloadable build of the latest
# `release` state.
#
# This workflow never changes the version. A plain push to `release` must
# not bump anything - the version bump plus GitHub Release is a separate,
# explicitly maintainer-triggered workflow (SPEC §13 point 2).
#
# Note: the `release` branch does not exist in the repository yet. That is
# expected; this workflow simply starts running as soon as it does.

on:
  push:
    branches: [release]

  # Manual trigger so this packaging recipe can be run against any branch
  # from the Actions tab - e.g. to CI-verify a change to this workflow
  # itself on a feature branch before it ever touches `release`, without
  # needing a throwaway push to `release` just to get a build to test
  # against. Takes no inputs: `ref` defaults to whatever branch the user
  # picks in the "Run workflow" branch selector.
  workflow_dispatch:

  # Entry point for the (separate) version-bump workflow, so the packaging
  # recipe lives in exactly one place instead of being duplicated there.
  # `ref` lets a caller package an exact commit - e.g. the freshly created
  # `chore(release): vX.Y.Z` commit - rather than the ref that happened to
  # start the run. Left empty (the default) it behaves like a normal push
  # build and checks out the triggering ref.
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to package. Defaults to the triggering ref."
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

  # Tauri's AppImage bundler downloads its helper tools at bundle time
  # (AppRun, linuxdeploy, and linuxdeploy's GTK/GStreamer plugin scripts),
  # and linuxdeploy is itself an AppImage. Self-mounting an AppImage needs
  # FUSE 2, which current Ubuntu images do not provide. This makes those
  # helpers unpack into a temp dir and run from there instead of mounting,
  # which removes the FUSE dependency entirely - verified by bundling
  # successfully in an Ubuntu 24.04 container that had no FUSE at all.
  #
  # The downloads mean AppImage bundling needs outbound network access at
  # build time (fine on GitHub-hosted runners) and is the one step here
  # that can fail for reasons outside this repository, e.g. a GitHub
  # release asset being temporarily unavailable. If that turns out to be
  # flaky in practice, re-running the job is the cheapest fix.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  package:
    name: Build .deb / .rpm / .AppImage (${{ matrix.arch }})
    # Native GitHub-hosted runners for both architectures - no
    # cross-compilation and no QEMU emulation. Cross-compiling a Tauri app
    # (native GTK/WebKit2GTK bindings, not just pure Rust) is fragile
    # enough that it's deliberately avoided here in favor of just running
    # the exact same build natively on a real aarch64 machine, same as
    # x86_64 already does. `fail-fast: false` so one architecture's build
    # failing doesn't cancel the other mid-run - each arch's result is
    # independently useful.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    # Matches the rest of the project's CI. Worth knowing: an AppImage is
    # only as portable as the glibc of the machine that built it, so the
    # artifact produced here requires a target system at least as new as
    # the runner image's Ubuntu. Pinning an older image (e.g.
    # `ubuntu-22.04`) would widen AppImage compatibility at the cost of
    # using a runner image that is closer to end-of-support.
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Empty for `push` runs, which means "the triggering ref".
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `frontend/` compiles to wasm32 and is built by Trunk via
          # tauri.conf.json's `beforeBuildCommand`, so the bundle build
          # needs this target even though the app itself is native.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend

      # Same base set as ci.yml's `build-tauri` job (per the official Tauri
      # 2 Linux prerequisites), plus `rpm`, because Ubuntu ships no rpm
      # tooling at all by default. It is installed deliberately rather than
      # trusting Tauri's rpm bundler to be fully self-contained; `.deb`
      # needs nothing beyond the base set.
      - name: Install Tauri 2 Linux system dependencies and rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            rpm

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # trunk builds the wasm frontend; cargo-tauri drives the release
      # build and the bundlers. The tauri-cli version is pinned to the one
      # this workflow was developed and verified against, so a CLI release
      # cannot silently change bundling behaviour on a release build.
      - name: Install trunk and tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli@2.2.7

      - name: npm ci (Tailwind CLI devDependency)
        working-directory: frontend
        run: npm ci

      # `bundle.targets` is "all" in tauri.conf.json, but the bundle list is
      # given explicitly here so this workflow produces exactly the three
      # artifacts it promises, regardless of what "all" expands to in a
      # future CLI version. `beforeBuildCommand` runs `trunk build
      # --release` for the frontend as part of this step.
      #
      # `working-directory: src-tauri` is load-bearing, not cosmetic:
      # confirmed by reproducing locally that `cargo tauri build` run from
      # the repo root resolves `beforeBuildCommand`'s `cd frontend` against
      # the WRONG directory (`frontend/` *inside* the already-resolved
      # frontend dist path, which does not exist) and fails with
      # "cd: frontend: No such file or directory" - the exact failure a
      # real run of this workflow hit. Running from `src-tauri/` is also
      # what `CONTRIBUTING.md` documents as the only supported invocation
      # directory for `cargo tauri dev`/`build`, so this just makes CI
      # match that convention instead of relying on cargo-tauri's cwd
      # resolution behaving the same from the repo root.
      - name: Build bundles (cargo tauri build)
        working-directory: src-tauri
        run: cargo tauri build --ci --bundles deb,rpm,appimage

      # Re-packages the AppImage with embedded update information and a
      # .zsync delta file, so AppImageUpdate (or any zsync-aware updater)
      # pointed at this GitHub repo can fetch only the changed blocks on a
      # future update instead of the whole file again. Tauri's own
      # bundler already built a working .AppImage via linuxdeploy's
      # embedded appimagetool, which also leaves the AppDir it built from
      # behind at target/release/bundle/appimage/*.AppDir (confirmed with
      # a real local build, 2026-10-20) - this step re-runs a standalone
      # appimagetool directly against that same AppDir with
      # `-u`/`--updateinformation`, producing a byte-different .AppImage
      # that REPLACES Tauri's own output (same filename, so nothing
      # downstream needs to change) plus a `.AppImage.zsync` file
      # alongside it.
      #
      # Load-bearing details, each verified against a real build rather
      # than assumed:
      # - `appimagetool -u` only works when given an AppDir to build from,
      #   not an already-built .AppImage (confirmed: passing an existing
      #   .AppImage as the source prints "To be implemented" and does
      #   nothing) - hence re-building from the AppDir, not re-stamping
      #   Tauri's output.
      # - zsyncmake must be on PATH *before* appimagetool runs, or it
      #   silently skips zsync generation with only a warning, never
      #   failing the build - the `command -v zsyncmake` check below turns
      #   that silent skip into a hard CI failure instead.
      # - zsyncmake writes the .zsync file into the *current working
      #   directory* using the bare basename of its target, not next to
      #   the output path it was given - confirmed by running this same
      #   invocation from the repo root first (the .zsync landed in the
      #   repo root) versus from inside the bundle directory (landed
      #   correctly next to the .AppImage). This step therefore runs with
      #   `working-directory` set to the bundle directory itself, passing
      #   only bare filenames, not paths.
      - name: Re-package the AppImage with update information + zsync
        # Repo-root-relative, NOT src-tauri/target/... - Cargo workspaces
        # share one target/ directory at the workspace root regardless of
        # which member directory a command is run from (confirmed: the
        # "Build bundles" step above runs with working-directory:
        # src-tauri yet the Upload steps below it already reference
        # target/release/bundle/... with no src-tauri/ prefix, and those
        # have worked in a real release - v0.1.0's assets prove it).
        working-directory: target/release/bundle/appimage
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage
        run: |
          set -euo pipefail

          sudo apt-get install -y zsync
          command -v zsyncmake >/dev/null || { echo "::error::zsyncmake not on PATH after installing zsync - appimagetool would silently skip .zsync generation."; exit 1; }

          curl -fL -o appimagetool "$APPIMAGETOOL_URL"
          chmod +x appimagetool

          appimage_path="$(find . -maxdepth 1 -type f -name '*.AppImage')"
          appdir_path="$(find . -maxdepth 1 -type d -name '*.AppDir')"
          if [[ -z "$appimage_path" || -z "$appdir_path" ]]; then
            echo "::error::Expected exactly one *.AppImage and one *.AppDir in $(pwd) from the cargo tauri build step above; found AppImage='$appimage_path' AppDir='$appdir_path'. Tauri's bundler output layout may have changed."
            exit 1
          fi
          appimage_name="$(basename "$appimage_path")"
          appdir_name="$(basename "$appdir_path")"
          # e.g. rustab_0.1.1_amd64.AppImage -> rustab_*_amd64.AppImage.zsync
          # - the version segment is the only part that changes release to
          # release, so it's the only part replaced with a glob.
          zsync_glob="$(echo "$appimage_name" | sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+_/_*_/').zsync"

          # linuxdeploy writes some of the AppDir's top-level convenience
          # symlinks (.DirIcon, the *.desktop symlink) as absolute paths
          # rooted at this runner's own working directory - squashfs stores
          # a symlink's target as a literal string, not resolved at mount
          # time, so every one of them is broken the moment the packaged
          # AppImage runs on any other machine (issue #15: AppManager
          # refusing to install, "Symlink target not found" naming this
          # exact CI path). Rewritten relative here, before packaging,
          # while the absolute targets still resolve on this machine for
          # `ln --relative` to compute the right relative form.
          while IFS= read -r -d '' link; do
            target="$(readlink "$link")"
            case "$target" in
              /*) ln -sfr "$target" "$link" ;;
            esac
          done < <(find "$appdir_name" -type l -print0)

          rm -f "$appimage_name"
          ./appimagetool -u "gh-releases-zsync|t0msk|rustab|latest|${zsync_glob}" "$appdir_name" "$appimage_name"

          if [[ ! -f "${appimage_name}.zsync" ]]; then
            echo "::error::${appimage_name}.zsync was not produced - zsync generation failed silently."
            exit 1
          fi
          rm -f appimagetool

      # Uploaded as four separate artifacts per architecture (deb, rpm,
      # AppImage, and its .zsync) so each package can be downloaded on its
      # own. The arch suffix is required, not cosmetic: artifact names
      # must be unique across the whole workflow run, and this matrix now
      # produces two builds of each format. `if-no-files-found: error` is
      # deliberate: a bundler that silently produced nothing must fail the
      # run rather than leave an empty artifact behind.
      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: rustab-deb-${{ matrix.arch }}
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v7
        with:
          name: rustab-rpm-${{ matrix.arch }}
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload .AppImage
        uses: actions/upload-artifact@v7
        with:
          name: rustab-appimage-${{ matrix.arch }}
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload .AppImage.zsync
        uses: actions/upload-artifact@v7
        with:
          name: rustab-appimage-zsync-${{ matrix.arch }}
          path: target/release/bundle/appimage/*.AppImage.zsync
          if-no-files-found: error
