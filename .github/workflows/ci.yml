name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rust fmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Root workspace (crates/fstab-core + src-tauri).
      - name: cargo fmt --check (native workspace)
        run: cargo fmt --check

      # frontend/ is a separate Cargo package (its own Cargo.toml, not a
      # workspace member) and is therefore not covered by the check above.
      - name: cargo fmt --check (frontend)
        working-directory: frontend
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            frontend

      - name: cargo clippy --workspace (native workspace, -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # frontend/ targets wasm32-unknown-unknown and is checked separately.
      - name: cargo clippy (frontend, wasm32, -D warnings)
        working-directory: frontend
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

  test:
    name: Test (native workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Runs fstab-core's unit/integration tests (incl. atomicity
      # failure-injection tests) alongside src-tauri's tests. This is the
      # most important gate in the project and must not be skipped or
      # allowed to fail silently.
      - name: cargo test --workspace
        run: cargo test --workspace

  build-tauri:
    name: Build Tauri app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # System packages required to build a Tauri 2 app on Ubuntu, per the
      # official Tauri 2 "Prerequisites" / Linux docs
      # (https://v2.tauri.app/start/prerequisites/#linux).
      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      # Debug build is sufficient to prove the Tauri app compiles; a full
      # installable bundle/AppImage is not required for this gate.
      - name: cargo build -p rustab
        run: cargo build -p rustab

  build-frontend:
    name: Build frontend (Trunk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: npm ci (Tailwind CLI devDependency)
        working-directory: frontend
        run: npm ci

      - name: trunk build
        working-directory: frontend
        run: trunk build
